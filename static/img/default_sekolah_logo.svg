<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Definitions for Gradients -->
  <defs>
    <linearGradient id="schoolShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="60%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="goldEduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <filter id="eduShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Ring (Lingkaran Pendidikan & Gerigi Prestasi) -->
  <circle cx="100" cy="100" r="92" fill="#F8FAFC" stroke="url(#goldEduGrad)" stroke-width="4" filter="url(#eduShadow)" />
  <circle cx="100" cy="100" r="86" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="4,2" />

  <!-- Shield Base (Perisai Sekolah) -->
  <path d="M 100 24 L 160 50 C 160 110 142 152 100 172 C 58 152 40 110 40 50 Z" 
        fill="url(#schoolShieldGrad)" stroke="url(#goldEduGrad)" stroke-width="2.5" filter="url(#eduShadow)" />

  <!-- Inner Border Line -->
  <path d="M 100 32 L 152 54 C 152 105 137 142 100 162 C 63 142 48 105 48 54 Z" 
        fill="none" stroke="#93C5FD" stroke-width="1.2" opacity="0.75" />

  <!-- Sayap Ilmu Pengetahuan (Kiri & Kanan) -->
  <!-- Sayap Kiri -->
  <path d="M 98 75 C 80 65 62 70 54 85 C 65 85 75 80 98 90 Z" fill="url(#goldEduGrad)"/>
  <path d="M 98 88 C 82 82 66 88 60 100 C 72 98 82 94 98 103 Z" fill="url(#goldEduGrad)"/>
  <!-- Sayap Kanan -->
  <path d="M 102 75 C 120 65 138 70 146 85 C 135 85 125 80 102 90 Z" fill="url(#goldEduGrad)"/>
  <path d="M 102 88 C 118 82 134 88 140 100 C 128 98 118 94 102 103 Z" fill="url(#goldEduGrad)"/>

  <!-- Obor Api Semangat Pembelajaran (Torch of Wisdom) -->
  <!-- Kobaran Api -->
  <path d="M 100 45 C 92 55 90 65 96 72 C 98 67 101 64 103 62 C 105 66 108 68 108 72 C 112 65 110 55 100 45 Z" fill="#EF4444"/>
  <path d="M 100 52 C 96 58 95 64 98 68 C 99 65 102 63 103 62 C 104 65 106 66 106 68 C 108 64 107 58 100 52 Z" fill="#F59E0B"/>
  <!-- Mangkok Obor -->
  <path d="M 92 72 L 108 72 L 105 82 L 95 82 Z" fill="url(#goldEduGrad)" stroke="#78350F" stroke-width="0.8"/>
  <!-- Tangkai Obor -->
  <path d="M 97 82 L 103 82 L 101 106 L 99 106 Z" fill="url(#goldEduGrad)"/>

  <!-- Buku Terbuka (Open Book of Knowledge) -->
  <path d="M 100 115 C 88 108 72 110 60 115 L 60 135 C 74 130 88 128 100 135 C 112 128 126 130 140 135 L 140 115 C 128 110 112 108 100 115 Z" 
        fill="#FFFFFF" stroke="#1E293B" stroke-width="1.2"/>
  <path d="M 100 115 L 100 135" stroke="#1E293B" stroke-width="1.2"/>
  <!-- Garis Tulisan Buku -->
  <line x1="68" y1="120" x2="92" y2="120" stroke="#94A3B8" stroke-width="1"/>
  <line x1="68" y1="125" x2="92" y2="125" stroke="#94A3B8" stroke-width="1"/>
  <line x1="108" y1="120" x2="132" y2="120" stroke="#94A3B8" stroke-width="1"/>
  <line x1="108" y1="125" x2="132" y2="125" stroke="#94A3B8" stroke-width="1"/>

  <!-- Banner Tut Wuri Handayani / Sekolah Mitra -->
  <path d="M 32 152 L 52 144 L 148 144 L 168 152 L 160 165 L 142 158 L 100 162 L 58 158 L 40 165 Z" 
        fill="url(#goldEduGrad)" stroke="#78350F" stroke-width="1.2" filter="url(#eduShadow)" />
  <text x="100" y="156" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="900" fill="#451A03" text-anchor="middle" letter-spacing="0.5">
    SEKOLAH MITRA
  </text>
  <text x="100" y="184" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="800" fill="#1E3A8A" text-anchor="middle" letter-spacing="1">
    KEMDIKBUDRISTEK
  </text>
</svg>
