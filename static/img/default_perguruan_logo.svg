<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Definitions for Gradients and Shadows -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A1C14" />
      <stop offset="60%" stop-color="#5C0E08" />
      <stop offset="100%" stop-color="#2E0402" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="40%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Golden Laurel Ring / Lingkaran Luar -->
  <circle cx="100" cy="100" r="92" fill="#FEF3C7" stroke="url(#goldGrad)" stroke-width="4" filter="url(#shadow)" />
  <circle cx="100" cy="100" r="86" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3,2" />

  <!-- Shield Base (Perisai Segi Lima Pencak Silat) -->
  <path d="M 100 20 L 165 48 C 165 110 145 155 100 176 C 55 155 35 110 35 48 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3" filter="url(#shadow)" />

  <!-- Inner Golden Shield Border -->
  <path d="M 100 28 L 157 52 C 157 106 140 146 100 166 C 60 146 43 106 43 52 Z" 
        fill="none" stroke="#FDE047" stroke-width="1.2" opacity="0.8" />

  <!-- Bintang Segi Delapan (Keagungan & Arah Mata Angin) -->
  <polygon points="100,32 103,40 111,37 106,44 113,49 105,52 108,60 100,55 92,60 95,52 87,49 94,44 89,37 97,40" 
           fill="url(#goldGrad)" />

  <!-- Keris Bersilang (Sepasang Senjata Pusaka Khas Silat Nusantara) -->
  <!-- Keris 1 (Kiri ke Kanan) -->
  <g transform="translate(100, 100) rotate(45) translate(-100, -100)">
    <!-- Bilah Keris Berlekuk (Luk 3) -->
    <path d="M 98 48 Q 102 60 98 72 Q 94 84 98 96 Q 102 108 98 120 L 102 120 Q 98 108 102 96 Q 106 84 102 72 Q 98 60 102 48 Z" fill="url(#bladeGrad)" stroke="#334155" stroke-width="0.8"/>
    <!-- Ganjo Keris -->
    <path d="M 93 120 L 107 120 L 109 125 L 91 125 Z" fill="url(#goldGrad)"/>
    <!-- Gagang Keris Berukir -->
    <path d="M 98 125 L 102 125 L 103 145 L 97 145 Z" fill="#78350F"/>
    <circle cx="100" cy="148" r="4" fill="url(#goldGrad)"/>
  </g>

  <!-- Keris 2 (Kanan ke Kiri) -->
  <g transform="translate(100, 100) rotate(-45) translate(-100, -100)">
    <!-- Bilah Keris Berlekuk (Luk 3) -->
    <path d="M 98 48 Q 102 60 98 72 Q 94 84 98 96 Q 102 108 98 120 L 102 120 Q 98 108 102 96 Q 106 84 102 72 Q 98 60 102 48 Z" fill="url(#bladeGrad)" stroke="#334155" stroke-width="0.8"/>
    <!-- Ganjo Keris -->
    <path d="M 93 120 L 107 120 L 109 125 L 91 125 Z" fill="url(#goldGrad)"/>
    <!-- Gagang Keris Berukir -->
    <path d="M 98 125 L 102 125 L 103 145 L 97 145 Z" fill="#78350F"/>
    <circle cx="100" cy="148" r="4" fill="url(#goldGrad)"/>
  </g>

  <!-- Simbol Pendekar Pasang Kuda-kuda (Siluet Tengah) -->
  <circle cx="100" cy="82" r="5" fill="#FDE047" />
  <path d="M 96 89 L 104 89 L 106 102 L 100 107 L 94 102 Z" fill="#FDE047" />
  <path d="M 94 92 L 86 98 L 88 102 L 95 97 Z" fill="#FDE047" />
  <path d="M 106 92 L 114 98 L 112 102 L 105 97 Z" fill="#FDE047" />
  <path d="M 97 106 L 90 120 L 85 118" stroke="#FDE047" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 103 106 L 110 120 L 115 118" stroke="#FDE047" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Pita Emas Bawah (Banner Sumpah Pendekar) -->
  <path d="M 28 152 L 50 144 L 150 144 L 172 152 L 164 165 L 145 158 L 100 162 L 55 158 L 36 165 Z" 
        fill="url(#goldGrad)" stroke="#78350F" stroke-width="1.2" filter="url(#shadow)" />
  <text x="100" y="156" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="900" fill="#451A03" text-anchor="middle" letter-spacing="0.8">
    PENCAK SILAT
  </text>
  <text x="100" y="185" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="800" fill="#78350F" text-anchor="middle" letter-spacing="1.2">
    INDONESIA
  </text>
</svg>
